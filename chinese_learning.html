<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Flashcards — HSK Vocabulary</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/chinese.css">
</head>
<body>
  <div class="page-wrap">

    <!-- CHINESE SUB-PAGE -->
    <div id="cool-chinese" class="cool-subpage active">
      <div id="chinese-section">
        <div class="chinese-header">
          <div class="chinese-title">Chinese Flashcards</div>
          <div class="chinese-desc">
            Practice HSK vocabulary with flashcards. Click the card to reveal pinyin, then click again for the definition. Select multiple HSK levels below.
          </div>
          <a class="game-link-btn" href="https://github.com/angelosaadeh/learching-chinese" target="_blank">⟶ View on GitHub</a>
        </div>

        <!-- HSK Filter with "All HSK" button -->
        <div class="hsk-filter" id="hsk-filter">
          <button class="hsk-select-all" id="hsk-select-all">All HSK</button>
          <div class="hsk-checkboxes" id="hsk-checkboxes">
            <div class="hsk-row">
              <label class="hsk-checkbox checked" data-level="HSK1">HSK1</label>
              <label class="hsk-checkbox checked" data-level="HSK2">HSK2</label>
              <label class="hsk-checkbox checked" data-level="HSK3">HSK3</label>
            </div>
            <div class="hsk-row">
              <label class="hsk-checkbox checked" data-level="HSK4">HSK4</label>
              <label class="hsk-checkbox checked" data-level="HSK5">HSK5</label>
              <label class="hsk-checkbox checked" data-level="HSK6">HSK6</label>
            </div>
          </div>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="cn-progress"></div>
        </div>

        <div class="flashcard" id="chinese-flashcard">
          <div class="flashcard-hint">click to reveal</div>
          <div class="fc-char" id="cn-fc-char">—</div>
          <div class="fc-pinyin" id="cn-fc-pinyin"></div>
          <div class="fc-definition" id="cn-fc-definition"></div>
          <div class="fc-hsk" id="cn-fc-hsk"></div>
        </div>

        <div class="chinese-controls">
          <button class="cn-btn" onclick="cnPrevCard()">← Previous</button>
          <button class="cn-btn" onclick="cnNextCard()">Next →</button>
          <span class="cn-counter" id="cn-counter">0/0</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Vocabulary data: defines `const characterData = [...]` -->
  <script src="js/data/chinese-vocab.js"></script>
  <!-- Flashcard logic -->
  <script src="js/chinese.js"></script>
</body>
</html>
